name: Feature request
description: Suggest an idea or improvement
labels: ["enhancement", "needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        StoryLoom stays deliberately small. The best proposals describe a writing problem, not a feature — that leaves room to solve it in a way that fits the rest of the app.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: What are you trying to do, and where does StoryLoom get in the way today?
      placeholder: When I revise, I lose track of which scenes I have already passed over, so I re-read chapters I finished last week.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like to see?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: What have you tried instead?
      description: Workarounds, other tools, or approaches you have considered.

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and discussions and this is not a duplicate.
          required: true
        - label: I understand this may be declined if it does not fit the project's scope.
          required: true
