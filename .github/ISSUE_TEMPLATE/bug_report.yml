name: Bug report
description: Something is broken or behaves unexpectedly
labels: ["bug", "needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file this.

        **Found a security vulnerability?** Do not file it here — see [SECURITY.md](https://github.com/storyloom/storyloom/blob/main/SECURITY.md).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, and what did you see?
      placeholder: I clicked the download button and the page scrolled to the top instead.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect instead?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      value: |
        1.
        2.
        3.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Where did you hit this?
      options:
        - Website
        - macOS app
        - Not sure
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Browser / macOS version
      placeholder: Safari 18.2 on macOS 15.2, Apple Silicon
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: StoryLoom version
      description: Skip this if the issue is on the website.
      placeholder: 1.0.0

  - type: textarea
    id: extra
    attributes:
      label: Screenshots, recordings, or console output
      description: Optional, but a screenshot usually saves a round trip.

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
